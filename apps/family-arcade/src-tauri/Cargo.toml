[package]
name = "family-arcade-hub"
version = "3.1.0"
description = "Family Arcade — one launcher for 53 family games"
authors = ["Family Arcade"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
lite = ["dep:reqwest", "dep:zip", "dep:sha2", "dep:hex"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[profile.release]
codegen-units = 16
lto = false
opt-level = 1
panic = "abort"
strip = true
