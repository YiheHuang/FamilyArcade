[package]
name = "family-arcade-hub"
version = "2.0.0"
description = "Family Arcade — one launcher for 42 family games"
authors = ["Family Arcade"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
lto = false
opt-level = 1
panic = "abort"
strip = true
