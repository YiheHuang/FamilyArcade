name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # the repo pins the gnu toolchain for local Windows builds; CI uses MSVC
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Unit tests (engine / AI / protocol / LAN relay)
        run: npm test
      - name: Type-check + frontend build
        run: npm run build

      - name: Rust toolchain (MSVC)
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests (LAN server)
        working-directory: src-tauri
        run: cargo test
