name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Rust toolchain (MSVC)
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Quality gate (type-check, unit tests, rust tests)
        run: npm run check

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Publish GitHub release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          installer=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)
          notes="docs/release-notes-${tag}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — refreshing the asset"
            gh release upload "$tag" "$installer" --clobber
          else
            if [ -f "$notes" ]; then
              gh release create "$tag" --title "Blokus $tag" --notes-file "$notes" "$installer"
            else
              gh release create "$tag" --title "Blokus $tag" --generate-notes "$installer"
            fi
          fi
