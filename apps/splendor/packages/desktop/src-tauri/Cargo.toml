[package]
name = "splendor-desktop"
version = "2.5.0"
description = "Splendor 家庭版桌面壳（Tauri）"
authors = ["family"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "splendor_desktop_lib"
# 仅桌面端：不需要 mobile 模板里的 staticlib/cdylib
# （GNU 工具链下 cdylib 在 debug 构建会因导出序号过大而链接失败）
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
if-addrs = "0.13"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
