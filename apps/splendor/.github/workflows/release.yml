name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Tauri shell (current): builds the installer, publishes it with checksums.
  # The *signed* LAN update bundle (update.json + payload) is produced locally by
  # `npm run release` because the Ed25519 private key never leaves the developer machine.
  #
  # Tags containing "electron" are the retired shell's historical releases and are
  # published manually (see README → Switching from the old shell).
  build:
    if: ${{ !contains(github.ref_name, 'electron') }}
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build engine (workspace dependency of client & server)
        run: npm run build -w @splendor/engine

      - name: Typecheck & tests
        run: |
          npm run typecheck
          npm test

      - name: Build client
        run: npm run build

      - name: Build Tauri installer
        run: npm run build -w @splendor/desktop

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $out = 'packages/desktop/src-tauri/target/release/bundle/nsis'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem $out -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'no installer produced' }
          $target = "artifacts/Splendor-Setup-${{ github.ref_name }}.exe"
          Copy-Item $installer.FullName $target
          $mb = [math]::Round($installer.Length / 1MB, 2)
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$hash  Splendor-Setup-${{ github.ref_name }}.exe ($mb MB)" | Add-Content artifacts/SHA256SUMS.txt
          if ($mb -gt 5) { throw "installer exceeds the 5 MB budget: $mb MB" }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Splendor Family Edition ${{ github.ref_name }}" --generate-notes artifacts/* || gh release upload "${{ github.ref_name }}" artifacts/* --clobber
