name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build engine (workspace dependency of client & server)
        run: npm run build -w @splendor/engine

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (engine / client / server)
        run: npm test

      - name: Build client
        run: npm run build -w @splendor/client

      - name: UI friction report (real clicks + assertions)
        run: node scripts/dev/play-test.mjs

      - name: Mobile layout report (three viewports)
        run: node scripts/dev/mobile-test.mjs

      - name: Screenshot regression (fixed seed, animations off)
        run: node scripts/dev/shots-regression.mjs

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: data/tmp/shots/
          if-no-files-found: ignore

  # Tauri shell: build the installer, enforce the size budget, run the shell checks.
  tauri:
    runs-on: windows-latest
    env:
      # The dev machine pins the GNU toolchain (rust-toolchain.toml); runners have MSVC,
      # which is fine because the crate is rlib-only.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Build Tauri installer
        run: npm run build -w @splendor/desktop

      - name: Installer size gate (<= 5 MB)
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'no installer produced' }
          $mb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "installer: $($installer.Name) — $mb MB"
          if ($mb -gt 5) { throw "installer exceeds the 5 MB budget: $mb MB" }

      - name: Shell checks (CDP attach, relay round trip, embedded assets, data dir)
        run: node scripts/dev/tauri-check.mjs

      - name: UDP room discovery check
        run: node scripts/dev/discovery-check.mjs
